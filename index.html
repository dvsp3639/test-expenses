            const [showSuggestions, setShowSuggestions] = useState(false);
            const [expenseData, setExpenseData] = useState({
                daily: 0,
                weekly: 0,
                monthly: 0,
                total: 0
            });
            const [comparisonPeriod, setComparisonPeriod] = useState('week');
            const [comparisonData, setComparisonData] = useState([]);
            const [pieChartData, setPieChartData] = useState(null);
            const [comparisonChartData, setComparisonChartData] = useState(null);
            const pieChartRef = useRef(null);
            const comparisonChartRef = useRef(null);

            const getAllItems = () => {
                const items = new Set();
                dailyEntries.forEach(entry => {
                    entry.materials.forEach(material => {
                        items.add(material.name);
                    });
                });
                return Array.from(items);
            };

            useEffect(() => {
                if (searchTerm.trim() === '') {
                    setSuggestions([]);
                    return;
                }

                const allItems = getAllItems();
                const filtered = allItems.filter(item => 
                    item.toLowerCase().includes(searchTerm.toLowerCase())
                );
                setSuggestions(filtered);
            }, [searchTerm, dailyEntries]);

            useEffect(() => {
                if (!selectedItem) {
                    setExpenseData({ daily: 0, weekly: 0, monthly: 0, total: 0 });
                    return;
                }

                const now = new Date();
                const todayIST = ISTUtils.getISTDate();
                const oneWeekAgo = new Date(now.getTime() - 7 * 24 * 60 * 60 * 1000);
                const oneWeekAgoIST = new Date(oneWeekAgo.getTime() + (5.5 * 60 * 60 * 1000)).toISOString().split('T')[0];
                const firstDayOfMonth = new Date(now.getFullYear(), now.getMonth(), 1);
                const firstDayOfMonthIST = new Date(firstDayOfMonth.getTime() + (5.5 * 60 * 60 * 1000)).toISOString().split('T')[0];

                let dailyTotal = 0;
                let weeklyTotal = 0;
                let monthlyTotal = 0;
                let allTimeTotal = 0;

                dailyEntries.forEach(entry => {
                    const entryDate = entry.date;
                    entry.materials.forEach(material => {
                        if (material.name === selectedItem) {
                            const amount = material.itemTotal || parseFloat(material.price) || 0;
                            allTimeTotal += amount;

                            if (entryDate === todayIST) {
                                dailyTotal += amount;
                            }

                            if (entryDate >= oneWeekAgoIST) {
                                weeklyTotal += amount;
                            }

                            if (entryDate >= firstDayOfMonthIST) {
                                monthlyTotal += amount;
                            }
                        }
                    });
                });

                setExpenseData({
                    daily: dailyTotal,
                    weekly: weeklyTotal,
                    monthly: monthlyTotal,
                    total: allTimeTotal
                });
            }, [selectedItem, dailyEntries]);

            useEffect(() => {
                if (!selectedItem) {
                    setComparisonData([]);
                    return;
                }

                const now = new Date();
                let data = [];

                if (comparisonPeriod === 'week') {
                    for (let i = 6; i >= 0; i--) {
                        const date = new Date(now);
                        date.setDate(date.getDate() - i);
                        const dateStr = new Date(date.getTime() + (5.5 * 60 * 60 * 1000)).toISOString().split('T')[0];
                        
                        let dayTotal = 0;
                        dailyEntries.forEach(entry => {
                            if (entry.date === dateStr) {
                                entry.materials.forEach(material => {
                                    if (material.name === selectedItem) {
                                        const amount = material.itemTotal || parseFloat(material.price) || 0;
                                        dayTotal += amount;
                                    }
                                });
                            }
                        });
                        
                        data.push({
                            label: date.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' }),
                            value: dayTotal
                        });
                    }
                } else if (comparisonPeriod === 'month') {
                    for (let i = 3; i >= 0; i--) {
                        const weekStart = new Date(now);
                        weekStart.setDate(weekStart.getDate() - (i * 7) - weekStart.getDay() + 1);
                        
                        const weekEnd = new Date(weekStart);
                        weekEnd.setDate(weekEnd.getDate() + 6);
                        
                        let weekTotal = 0;
                        dailyEntries.forEach(entry => {
                            const entryDate = new Date(entry.date);
                            if (entryDate >= weekStart && entryDate <= weekEnd) {
                                entry.materials.forEach(material => {
                                    if (material.name === selectedItem) {
                                        const amount = material.itemTotal || parseFloat(material.price) || 0;
                                        weekTotal += amount;
                                    }
                                });
                            }
                        });
                        
                        data.push({
                            label: `Week ${4-i} (${weekStart.toLocaleDateString('en-US', { month: 'short', day: 'numeric' })} - ${weekEnd.toLocaleDateString('en-US', { month: 'short', day: 'numeric' })})`,
                            value: weekTotal
                        });
                    }
                } else if (comparisonPeriod === 'quarter') {
                    for (let i = 2; i >= 0; i--) {
                        const month = new Date(now.getFullYear(), now.getMonth() - i, 1);
                        const monthName = month.toLocaleDateString('en-US', { month: 'long', year: 'numeric' });
                        
                        let monthTotal = 0;
                        dailyEntries.forEach(entry => {
                            const entryDate = new Date(entry.date);
                            if (entryDate.getMonth() === month.getMonth() && entryDate.getFullYear() === month.getFullYear()) {
                                entry.materials.forEach(material => {
                                    if (material.name === selectedItem) {
                                        const amount = material.itemTotal || parseFloat(material.price) || 0;
                                        monthTotal += amount;
                                    }
                                });
                            }
                        });
                        
                        data.push({
                            label: monthName,
                            value: monthTotal
                        });
                    }
                }

                setComparisonData(data);
            }, [selectedItem, comparisonPeriod, dailyEntries]);

            useEffect(() => {
                if (!pieChartRef.current) return;

                const allItemsExpenses = {};
                dailyEntries.forEach(entry => {
                    entry.materials.forEach(material => {
                        const amount = material.itemTotal || parseFloat(material.price) || 0;
                        if (allItemsExpenses[material.name]) {
                            allItemsExpenses[material.name] += amount;
                        } else {
                            allItemsExpenses[material.name] = amount;
                        }
                    });
                });

                const sortedItems = Object.entries(allItemsExpenses)
                    .sort((a, b) => b[1] - a[1]);

                const top10Items = sortedItems.slice(0, 10);
                const othersItems = sortedItems.slice(10);
                
                const othersTotal = othersItems.reduce((sum, item) => sum + item[1], 0);

                let labels = top10Items.map(item => item[0]);
                let data = top10Items.map(item => item[1]);
                
                let backgroundColors = labels.map(label => {
                    if (selectedItem && label === selectedItem) {
                        return '#ff7f00';
                    } else {
                        return '#6c757d';
                    }
                });

                if (othersItems.length > 0) {
                    labels.push('Others');
                    data.push(othersTotal);
                    const isSelectedInOthers = othersItems.some(item => item[0] === selectedItem);
                    backgroundColors.push(isSelectedInOthers ? '#ff7f00' : '#adb5bd');
                }

                const ctx = pieChartRef.current.getContext('2d');
                
                if (pieChartData) {
                    pieChartData.destroy();
                }

                const newChart = new Chart(ctx, {
                    type: 'pie',
                    data: {
                        labels: labels,
                        datasets: [{
                            data: data,
                            backgroundColor: backgroundColors,
                            borderWidth: 1
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            legend: {
                                position: 'right',
                                labels: {
                                    boxWidth: 12,
                                    font: {
                                        size: 10
                                    }
                                }
                            },
                            title: {
                                display: true,
                                text: selectedItem 
                                    ? `Expense Distribution - ${selectedItem} Highlighted`
                                    : 'Expense Distribution (Top 10 + Others)'
                            },
                            tooltip: {
                                callbacks: {
                                    label: function(context) {
                                        const label = context.label || '';
                                        const value = context.raw || 0;
                                        const total = context.dataset.data.reduce((a, b) => a + b, 0);
                                        const percentage = Math.round((value / total) * 100);
                                        return `${label}: ₹${value.toFixed(2)} (${percentage}%)`;
                                    }
                                }
                            }
                        }
                    }
                });

                setPieChartData(newChart);
            }, [dailyEntries, selectedItem]);

            useEffect(() => {
                if (!selectedItem || !comparisonChartRef.current || comparisonData.length === 0) return;

                const ctx = comparisonChartRef.current.getContext('2d');
                
                if (comparisonChartData) {
                    comparisonChartData.destroy();
                }

                const newChart = new Chart(ctx, {
                    type: 'bar',
                    data: {
                        labels: comparisonData.map(item => item.label),
                        datasets: [{
                            label: `Spending on ${selectedItem}`,
                            data: comparisonData.map(item => item.value),
                            backgroundColor: '#ff7f00',
                            borderColor: '#cc6600',
                            borderWidth: 1
                        }]
                    },
                    options: {
                        responsive: true,
                        plugins: {
                            legend: {
                                display: true,
                                position: 'top',
                            },
                            title: {
                                display: true,
                                text: `${comparisonPeriod.charAt(0).toUpperCase() + comparisonPeriod.slice(1)}ly Spending Comparison`
                            }
                        },
                        scales: {
                            y: {
                                beginAtZero: true,
                                title: {
                                    display: true,
                                    text: 'Amount (₹)'
                                }
                            }
                        }
                    }
                });

                setComparisonChartData(newChart);
            }, [comparisonData, selectedItem, comparisonPeriod]);

            const handleSuggestionClick = (item) => {
                setSelectedItem(item);
                setSearchTerm(item);
                setShowSuggestions(false);
            };

            const totalExpenses = dailyEntries.reduce((sum, entry) => sum + entry.total, 0);
            const selectedItemPercentage = selectedItem && totalExpenses > 0 
                ? ((expenseData.total / totalExpenses) * 100).toFixed(1) 
                : 0;

            return (
                <div className="card">
                    <div className="card-header d-flex justify-content-between align-items-center">
                        <h5 className="mb-0">Expense Analysis - {getOutletName(currentOutlet)}</h5>
                        <div>
                            {firebaseStatus === 'connected' ? (
                                <span className="badge bg-success real-time-badge">
                                    <i className="bi bi-circle-fill"></i> {isRealTimeActive ? 'Live Data' : 'Firebase Connected'}
                                </span>
                            ) : (
                                <span className="badge bg-warning">
                                    <i className="bi bi-exclamation-triangle"></i> Local Data Only
                                </span>
                            )}
                        </div>
                    </div>
                    <div className="card-body">
                        
                        {dailyEntries.length === 0 ? (
                            <div className="text-center py-5">
                                <i className="bi bi-inbox display-1 text-muted"></i>
                                <h4 className="mt-3 text-muted">No expense data available</h4>
                                <p className="text-muted">Start adding daily entries to see analysis data</p>
                                {firebaseStatus !== 'connected' && (
                                    <div className="alert alert-warning mt-3">
                                        <i className="bi bi-exclamation-triangle"></i> Firebase connection required for multi-device sync
                                    </div>
                                )}
                            </div>
                        ) : (
                            <>
                                <div className="row mb-4">
                                    <div className="col-md-6">
                                        <div className="form-group">
                                            <label htmlFor="itemSearch" className="form-label">Search Item</label>
                                            <input
                                                type="text"
                                                className="form-control"
                                                id="itemSearch"
                                                placeholder="Start typing to search items..."
                                                value={searchTerm}
                                                onChange={(e) => {
                                                    setSearchTerm(e.target.value);
                                                    setShowSuggestions(true);
                                                }}
                                                onFocus={() => setShowSuggestions(true)}
                                            />
                                            {showSuggestions && suggestions.length > 0 && (
                                                <div className="dropdown-menu show w-100">
                                                    {suggestions.map((item, index) => (
                                                        <button
                                                            key={index}
                                                            className={`dropdown-item ${selectedItem === item ? 'highlighted-item' : ''}`}
                                                            type="button"
                                                            onClick={() => handleSuggestionClick(item)}
                                                        >
                                                            {item}
                                                        </button>
                                                    ))}
                                                </div>
                                            )}
                                        </div>
                                    </div>
                                </div>

                                <div className="chart-container">
                                    <canvas ref={pieChartRef}></canvas>
                                </div>

                                {selectedItem && (
                                    <div>
                                        <div className="expense-breakdown">
                                            <h5>Expense Breakdown for "{selectedItem}"</h5>
                                            <div className="row mt-3">
                                                <div className="col-md-3 text-center">
                                                    <div className="card bg-light">
                                                        <div className="card-body">
                                                            <h6>Today</h6>
                                                            <h4 className="text-primary">₹{expenseData.daily.toFixed(2)}</h4>
                                                        </div>
                                                    </div>
                                                </div>
                                                <div className="col-md-3 text-center">
                                                    <div className="card bg-light">
                                                        <div className="card-body">
                                                            <h6>This Week</h6>
                                                            <h4 className="text-success">₹{expenseData.weekly.toFixed(2)}</h4>
                                                        </div>
                                                    </div>
                                                </div>
                                                <div className="col-md-3 text-center">
                                                    <div className="card bg-light">
                                                        <div className="card-body">
                                                            <h6>This Month</h6>
                                                            <h4 className="text-warning">₹{expenseData.monthly.toFixed(2)}</h4>
                                                        </div>
                                                    </div>
                                                </div>
                                                <div className="col-md-3 text-center">
                                                    <div className="card bg-light">
                                                        <div className="card-body">
                                                            <h6>All Time</h6>
                                                            <h4 className="text-danger">₹{expenseData.total.toFixed(2)}</h4>
                                                        </div>
                                                    </div>
                                                </div>
                                            </div>
                                        </div>

                                        <div className="row mt-4">
                                            <div className="col-md-6">
                                                <h5>Insights</h5>
                                                <div className="alert alert-info">
                                                    <p>
                                                        <strong>{selectedItem}</strong> represents{' '}
                                                        <strong>{selectedItemPercentage}%</strong>{' '}
                                                        of your total expenses.
                                                    </p>
                                                    <p>
                                                        Your monthly spending on this item is{' '}
                                                        <strong>₹{expenseData.monthly.toFixed(2)}</strong>.
                                                    </p>
                                                    {expenseData.weekly > 0 && (
                                                        <p>
                                                            This week, you've spent{' '}
                                                            <strong>₹{expenseData.weekly.toFixed(2)}</strong> on {selectedItem}.
                                                        </p>
                                                    )}
                                                </div>
                                            </div>
                                        </div>

                                        <div className="period-selector">
                                            <h5>Spending Comparison</h5>
                                            <div className="row">
                                                <div className="col-md-4">
                                                    <select 
                                                        className="form-select"
                                                        value={comparisonPeriod}
                                                        onChange={(e) => setComparisonPeriod(e.target.value)}
                                                    >
                                                        <option value="week">Last 7 Days</option>
                                                        <option value="month">Last 4 Weeks</option>
                                                        <option value="quarter">Last 3 Months</option>
                                                    </select>
                                                </div>
                                            </div>
                                        </div>

                                        <div className="comparison-chart">
                                            <canvas ref={comparisonChartRef}></canvas>
                                        </div>

                                        <div className="mt-4">
                                            <h5>Comparison Details</h5>
                                            <div className="table-responsive">
                                                <table className="table table-striped">
                                                    <thead>
                                                        <tr>
                                                            <th>Period</th>
                                                            <th>Amount Spent</th>
                                                        </tr>
                                                    </thead>
                                                    <tbody>
                                                        {comparisonData.map((item, index) => (
                                                            <tr key={index}>
                                                                <td>{item.label}</td>
                                                                <td><strong>₹{item.value.toFixed(2)}</strong></td>
                                                            </tr>
                                                        ))}
                                                    </tbody>
                                                </table>
                                            </div>
                                        </div>
                                    </div>
                                )}

                                {!selectedItem && (
                                    <div className="text-center py-5">
                                        <i className="bi bi-search display-1 text-muted"></i>
                                        <h4 className="mt-3 text-muted">Search for an item to see detailed analysis</h4>
                                        <p className="text-muted">Start typing in the search box above to find items from your expense history</p>
                                    </div>
                                )}
                            </>
                        )}
                    </div>
                </div>
            );
        };

        // UPDATED: Sales & Expenses Report Tab Component - Shows specific outlet sales and expenses
        const SalesExpensesReportTab = ({ currentUser, currentOutlet, getOutletName, firebaseStatus }) => {
            const [date, setDate] = useState(ISTUtils.getISTDate());
            const [saving, setSaving] = useState(false);
            const [reportPeriod, setReportPeriod] = useState('today');
            const [reportData, setReportData] = useState(null);
            const [reportLoading, setReportLoading] = useState(false);
            const [showPdfPreview, setShowPdfPreview] = useState(false);
            const [pdfContent, setPdfContent] = useState('');
            const [customStartDate, setCustomStartDate] = useState('');
            const [customEndDate, setCustomEndDate] = useState('');
            
            // Form data for the current outlet
            const [salesExpensesForm, setSalesExpensesForm] = useState({
                sales: {
                    dineInCash: '',
                    dineInOnline: '',
                    swiggy: '',
                    zomato: ''
                },
                expenses: {
                    cashExpenses: '',
                    onlineExpenses: '',
                    cashBills: [],   // Changed to array for multiple bills
                    onlineBills: []  // Changed to array for multiple bills
                }
            });

            // Load saved sales & expenses data for the selected date and current outlet
            useEffect(() => {
                const loadSalesExpensesData = async () => {
                    if (firebaseStatus === 'connected') {
                        const data = await FirebaseService.loadSalesExpensesReport(currentOutlet, date);
                        if (data) {
                            setSalesExpensesForm({
                                sales: data.sales || { dineInCash: '', dineInOnline: '', swiggy: '', zomato: '' },
                                expenses: data.expenses || { cashExpenses: '', onlineExpenses: '', cashBills: [], onlineBills: [] }
                            });
                        }
                    }
                };
                
                loadSalesExpensesData();
            }, [currentOutlet, date, firebaseStatus]);

            // Handle form changes
            const handleFormChange = (section, field, value) => {
                setSalesExpensesForm(prev => ({
                    ...prev,
                    [section]: {
                        ...prev[section],
                        [field]: value
                    }
                }));
            };

            // Handle multiple bill upload for cash expenses
            const handleCashBillsUpload = async (files) => {
                if (!files || files.length === 0) return;
                
                // Check total file size (max 20MB for all files)
                const totalSize = Array.from(files).reduce((sum, file) => sum + file.size, 0);
                if (totalSize > 20 * 1024 * 1024) {
                    alert('Total file size too large. Please select files smaller than 20MB total.');
                    return;
                }
                
                // Check file types
                const allowedTypes = ['image/jpeg', 'image/png', 'image/jpg', 'application/pdf'];
                const invalidFiles = Array.from(files).filter(file => !allowedTypes.includes(file.type));
                if (invalidFiles.length > 0) {
                    alert('Please select only JPEG, PNG, or PDF files.');
                    return;
                }
                
                const itemId = `sales-expenses-${currentOutlet}-cash-${date}`;
                const uploadedBills = await FileUploadService.uploadMultipleBills(files, itemId, currentOutlet, date);
                
                if (uploadedBills.length > 0) {
                    const currentBills = salesExpensesForm.expenses.cashBills || [];
                    setSalesExpensesForm(prev => ({
                        ...prev,
                        expenses: {
                            ...prev.expenses,
                            cashBills: [...currentBills, ...uploadedBills]
                        }
                    }));
                }
            };

            // Handle multiple bill upload for online expenses
            const handleOnlineBillsUpload = async (files) => {
                if (!files || files.length === 0) return;
                
                const totalSize = Array.from(files).reduce((sum, file) => sum + file.size, 0);
                if (totalSize > 20 * 1024 * 1024) {
                    alert('Total file size too large. Please select files smaller than 20MB total.');
                    return;
                }
                
                const allowedTypes = ['image/jpeg', 'image/png', 'image/jpg', 'application/pdf'];
                const invalidFiles = Array.from(files).filter(file => !allowedTypes.includes(file.type));
                if (invalidFiles.length > 0) {
                    alert('Please select only JPEG, PNG, or PDF files.');
                    return;
                }
                
                const itemId = `sales-expenses-${currentOutlet}-online-${date}`;
                const uploadedBills = await FileUploadService.uploadMultipleBills(files, itemId, currentOutlet, date);
                
                if (uploadedBills.length > 0) {
                    const currentBills = salesExpensesForm.expenses.onlineBills || [];
                    setSalesExpensesForm(prev => ({
                        ...prev,
                        expenses: {
                            ...prev.expenses,
                            onlineBills: [...currentBills, ...uploadedBills]
                        }
                    }));
                }
            };

            // Remove cash bill
            const removeCashBill = async (index) => {
                const billToRemove = salesExpensesForm.expenses.cashBills[index];
                if (billToRemove) {
                    await FileUploadService.deleteBill(billToRemove);
                    
                    const updatedBills = salesExpensesForm.expenses.cashBills.filter((_, i) => i !== index);
                    setSalesExpensesForm(prev => ({
                        ...prev,
                        expenses: {
                            ...prev.expenses,
                            cashBills: updatedBills
                        }
                    }));
                }
            };

            // Remove online bill
            const removeOnlineBill = async (index) => {
                const billToRemove = salesExpensesForm.expenses.onlineBills[index];
                if (billToRemove) {
                    await FileUploadService.deleteBill(billToRemove);
                    
                    const updatedBills = salesExpensesForm.expenses.onlineBills.filter((_, i) => i !== index);
                    setSalesExpensesForm(prev => ({
                        ...prev,
                        expenses: {
                            ...prev.expenses,
                            onlineBills: updatedBills
                        }
                    }));
                }
            };

            // Calculate totals
            const calculateTotals = () => {
                const sales = salesExpensesForm.sales;
                const expenses = salesExpensesForm.expenses;
                
                const totalSales = (
                    (parseFloat(sales.dineInCash) || 0) +
                    (parseFloat(sales.dineInOnline) || 0) +
                    (parseFloat(sales.swiggy) || 0) +
                    (parseFloat(sales.zomato) || 0)
                );
                
                const totalExpenses = (
                    (parseFloat(expenses.cashExpenses) || 0) +
                    (parseFloat(expenses.onlineExpenses) || 0)
                );
                
                const c2c = (parseFloat(sales.dineInCash) || 0) - (parseFloat(expenses.cashExpenses) || 0);
                
                return { totalSales, totalExpenses, c2c };
            };

            // Save Sales & Expenses data
            const handleSave = async () => {
                const { sales, expenses } = salesExpensesForm;
                
                // Validate required fields
                if (!sales.dineInCash || !sales.dineInOnline || !sales.swiggy || !sales.zomato ||
                    !expenses.cashExpenses || !expenses.onlineExpenses) {
                    alert('Please fill all the fields for sales and expenses.');
                    return;
                }

                setSaving(true);

                const totals = calculateTotals();
                
                const data = {
                    sales: {
                        dineInCash: parseFloat(sales.dineInCash) || 0,
                        dineInOnline: parseFloat(sales.dineInOnline) || 0,
                        swiggy: parseFloat(sales.swiggy) || 0,
                        zomato: parseFloat(sales.zomato) || 0
                    },
                    expenses: {
                        cashExpenses: parseFloat(expenses.cashExpenses) || 0,
                        onlineExpenses: parseFloat(expenses.onlineExpenses) || 0,
                        cashBills: expenses.cashBills || [],
                        onlineBills: expenses.onlineBills || []
                    },
                    ...totals,
                    submittedBy: currentUser.name,
                    timestamp: ISTUtils.getFullISTDateTime()
                };

                const success = await FirebaseService.saveSalesExpensesReport(currentOutlet, date, data);
                setSaving(false);

                if (success) {
                    alert('Sales & Expenses data saved successfully!');
                } else {
                    alert('Failed to save Sales & Expenses data.');
                }
            };

            // Generate report
            const generateReport = async () => {
                let startDate, endDate;
                
                switch (reportPeriod) {
                    case 'today':
                        startDate = date;
                        endDate = date;
                        break;
                    case 'week':
                        const weekAgo = new Date(new Date(date).getTime() - 6 * 24 * 60 * 60 * 1000);
                        startDate = new Date(weekAgo.getTime() + (5.5 * 60 * 60 * 1000)).toISOString().split('T')[0];
                        endDate = date;
                        break;
                    case 'month':
                        const monthAgo = new Date(new Date(date).getFullYear(), new Date(date).getMonth(), 1);
                        startDate = new Date(monthAgo.getTime() + (5.5 * 60 * 60 * 1000)).toISOString().split('T')[0];
                        endDate = date;
                        break;
                    case 'custom':
                        if (!customStartDate || !customEndDate) {
                            alert('Please select both start and end dates for custom period.');
                            return;
                        }

                setDebugInfo(prev => [...prev.slice(-9), newMessage]);
                console.log(`[${type.toUpperCase()}] ${newMessage}`);
            };

            useEffect(() => {
                const testConnection = async () => {

                    setFirebaseStatus('testing');
                    
                    const result = await FirebaseService.testConnection();
                    
                    if (result.success) {
                        addDebugMessage('✅ Firebase connection successful', 'success');
                        setFirebaseStatus('connected');

                    const savedOutlet = localStorage.getItem('currentOutlet') || 'orange_grand';

                        orange_restaurant: restaurantEntries || []
                    });
                    
                    const currentEntries = savedOutlet === 'orange_grand' ? grandEntries : restaurantEntries;
                    if (currentEntries !== null) {
                        setDailyEntries(currentEntries);
                        setSyncStatus('success');
                        setLastSync(new Date());
                        addDebugMessage(`✅ Loaded ${currentEntries.length} entries for ${savedOutlet}`, 'success');
                    } else {
                        const savedDailyEntries = JSON.parse(localStorage.getItem(`dailyEntries_${savedOutlet}`)) || [];
                        setDailyEntries(savedDailyEntries);
                        setSyncStatus('error');
                        addDebugMessage(`⚠️ Using localStorage fallback with ${savedDailyEntries.length} entries`, 'warning');
                    }
                    
                    resetDailyItems(savedOutlet);
                };

                if (currentUser && (firebaseStatus === 'connected' || firebaseStatus === 'failed')) {
                    initializeData();
                }
            }, [currentUser, firebaseStatus]);

            useEffect(() => {
                if (firebaseStatus !== 'connected' || !currentUser) return;
                
                if (realtimeUnsubscribe) {
                    addDebugMessage('Unsubscribing from previous real-time listener', 'info');
                    realtimeUnsubscribe();
                }
                
                addDebugMessage(`Setting up real-time listener for ${currentOutlet}`, 'info');
                
                setIsRealTimeActive(false);
                
                const unsubscribe = FirebaseService.setupRealtimeListener(currentOutlet, (entries) => {
                    addDebugMessage(`📡 Real-time update received: ${entries.length} entries`, 'success');
                    
                    setIsRealTimeActive(true);
                    
                    if (!isLocalChange) {
                        setDailyEntries(entries);
                        setOutletData(prev => ({
                            ...prev,
                            [currentOutlet]: entries
                        }));
                        setSyncStatus('success');
                        setLastSync(new Date());
                        localStorage.setItem(`dailyEntries_${currentOutlet}`, JSON.stringify(entries));
                    }
                    
                    setIsLocalChange(false);
                });
                
                setRealtimeUnsubscribe(() => unsubscribe);
                
                return () => {
                    if (unsubscribe) {
                        addDebugMessage('Cleaning up real-time listener', 'info');
                        unsubscribe();
                        setIsRealTimeActive(false);
                    }
                };
            }, [currentOutlet, firebaseStatus, currentUser]);

            useEffect(() => {
                if (dailyEntries.length >= 0 && currentUser && firebaseStatus === 'connected') {
                    const shouldSave = isLocalChange || syncStatus === 'syncing';
                    
                    if (shouldSave && dailyEntries.length > 0) {
                        addDebugMessage(`Data changed - saving ${dailyEntries.length} entries`, 'info');
                        localStorage.setItem(`dailyEntries_${currentOutlet}`, JSON.stringify(dailyEntries));
                        
                        setOutletData(prev => ({
                            ...prev,
                            [currentOutlet]: dailyEntries
                        }));
                        
                        const saveToFirebase = async () => {
                            setSyncStatus('syncing');
                            const success = await FirebaseService.saveOutletData(currentOutlet, dailyEntries);
                            if (success) {
                                setSyncStatus('success');
                                setLastSync(new Date());
                                addDebugMessage('✅ Data saved to Firebase successfully', 'success');
                            } else {
                                setSyncStatus('error');
                                addDebugMessage('❌ Failed to save data to Firebase', 'error');
                            }
                        };
                        
                        saveToFirebase();
                    }
                }
            }, [dailyEntries, currentOutlet, currentUser, firebaseStatus]);

            const resetDailyItems = (outlet) => {
                const items = getAllItemsForOutlet(outlet);
                setDailyItems(items);
            };

            const switchOutlet = async (outlet) => {
                addDebugMessage(`Switching outlet to: ${outlet}`, 'info');
                
                setIsRealTimeActive(false);
                setCurrentOutlet(outlet);
                localStorage.setItem('currentOutlet', outlet);
                
                setSyncStatus('syncing');
                
                const outletEntries = outletData[outlet] || [];
                setDailyEntries(outletEntries);
                setSyncStatus('success');
                setLastSync(new Date());
                addDebugMessage(`✅ Switched to ${outlet} with ${outletEntries.length} entries`, 'success');
                
                resetDailyItems(outlet);
                setNewUnexpectedItem({ name: '', price: '', quantity: '', bills: [] });
                
                setTimeout(() => {
                    setIsRealTimeActive(true);
                }, 1000);
            };

            const updateItemField = (id, field, value) => {
                setDailyItems(prev => 
                    prev.map(item => 
                        item.id === id ? { ...item, [field]: value } : item
                    )
                );
            };

            const handleBillsUpload = (itemId, newBills) => {
                setDailyItems(prev => 
                    prev.map(item => {
                        if (item.id === itemId) {
                            const currentBills = item.bills || [];
                            return { ...item, bills: [...currentBills, ...newBills] };
                        }
                        return item;
                    })
                );
            };

            // FIXED: Updated addUnexpectedItem function
            const addUnexpectedItem = () => {
                if (newUnexpectedItem.name && newUnexpectedItem.price) {
                    const priceValue = parseFloat(newUnexpectedItem.price) || 0;
                    
                    if (priceValue <= 0) {
                        alert("Please enter a valid price greater than 0");
                        return;
                    }

                    const newItem = {
                        id: `unexpected-${Date.now()}-${Math.random().toString(36).substr(2, 9)}`,
                        name: newUnexpectedItem.name,
                        price: priceValue,
                        quantity: newUnexpectedItem.quantity || '',
                        bills: newUnexpectedItem.bills || [],
                        isUnexpected: true
                    };
                    
                    setDailyItems(prev => [...prev, newItem]);
                    setNewUnexpectedItem({ name: '', price: '', quantity: '', bills: [] });
                    addDebugMessage(`Added unexpected item: ${newItem.name}`, 'info');
                } else {
                    alert("Please enter item name and price");
                }
            };

            const removeUnexpectedItem = (id) => {
                // Find the item to delete its bills
                const itemToRemove = dailyItems.find(item => item.id === id && item.isUnexpected);
                if (itemToRemove && itemToRemove.bills && itemToRemove.bills.length > 0) {
                    FileUploadService.deleteMultipleBills(itemToRemove.bills);
                }
                
                setDailyItems(prev => prev.filter(item => !(item.id === id && item.isUnexpected)));
            };

            // Add unique IDs to entries
            const addDailyEntry = () => {
                const today = ISTUtils.getISTDate();
                const timestamp = ISTUtils.getFullISTDateTime();
                
                const validItems = dailyItems.filter(item => 
                    item.price && parseFloat(item.price) > 0 && item.quantity
                );

                if (validItems.length === 0) {
                    alert("Please enter at least one item with price and quantity");
                    return;
                }

                const itemsWithTotals = validItems.map(item => ({
                    ...item,
                    itemTotal: parseFloat(item.price) || 0
                }));

                const total = itemsWithTotals.reduce((sum, item) => sum + item.itemTotal, 0);

                const entry = {
                    id: `entry-${Date.now()}-${Math.random().toString(36).substr(2, 9)}`,
                    date: today,
                    timestamp: timestamp,
                    materials: itemsWithTotals,
                    total: total,
                    submittedBy: currentUser.name,
                    approvedBy: currentUser.role === 'approver' ? currentUser.name : null,
                    status: currentUser.role === 'approver' ? 'approved' : 'pending',
                    outlet: currentOutlet
                };

                addDebugMessage(`Adding new daily entry with ${validItems.length} items`, 'info');
                
                setIsLocalChange(true);
                setDailyEntries(prev => [entry, ...prev]);
                
                const unexpectedItems = dailyItems.filter(item => item.isUnexpected);
                resetDailyItems(currentOutlet);
                setDailyItems(prev => [...prev.filter(item => !item.isUnexpected), ...unexpectedItems]);
                
                alert(`Daily entry saved for ${getOutletName(currentOutlet)}!`);
            };

            // Add unique IDs to past entries
            const addPastEntry = (selectedDate) => {
                const timestamp = ISTUtils.getFullISTDateTime();
                
                const validItems = dailyItems.filter(item => 
                    item.price && parseFloat(item.price) > 0 && item.quantity
                );

                if (validItems.length === 0) {
                    alert("Please enter at least one item with price and quantity");
                    return;
                }

                const itemsWithTotals = validItems.map(item => ({
                    ...item,
                    itemTotal: parseFloat(item.price) || 0
                }));

                const total = itemsWithTotals.reduce((sum, item) => sum + item.itemTotal, 0);

                const entry = {
                    id: `entry-${Date.now()}-${Math.random().toString(36).substr(2, 9)}`,
                    date: selectedDate,
                    timestamp: timestamp,
                    materials: itemsWithTotals,
                    total: total,
                    submittedBy: currentUser.name,
                    approvedBy: currentUser.role === 'approver' ? currentUser.name : null,
                    status: currentUser.role === 'approver' ? 'approved' : 'pending',
                    outlet: currentOutlet,
                    isPastEntry: true
                };

                addDebugMessage(`Adding past entry for ${selectedDate} with ${validItems.length} items`, 'info');
                
                setIsLocalChange(true);
                setDailyEntries(prev => [entry, ...prev]);
                
                const unexpectedItems = dailyItems.filter(item => item.isUnexpected);
                resetDailyItems(currentOutlet);
                setDailyItems(prev => [...prev.filter(item => !item.isUnexpected), ...unexpectedItems]);
                
                alert(`Past entry saved for ${getOutletName(currentOutlet)} on ${ISTUtils.formatISTDate(selectedDate)}!`);
            };

            // New approveEntry function with ID support
            const approveEntry = (outlet, entryId) => {
                addDebugMessage(`Approving entry ${entryId} for ${outlet}`, 'info');
                
                setIsLocalChange(true);
                setOutletData(prev => {
                    const newData = { ...prev };
                    newData[outlet] = newData[outlet].map(entry => 
                        entry.id === entryId 
                            ? { 
                                ...entry, 
                                approvedBy: currentUser.name, 
                                status: 'approved',
                                approvedAt: ISTUtils.getFullISTDateTime()
                            }
                            : entry
                    );
                    return newData;
                });
                
                if (currentOutlet === outlet) {
                    setDailyEntries(prev => 
                        prev.map(entry => 
                            entry.id === entryId 
                                ? { 
                                    ...entry, 
                                    approvedBy: currentUser.name, 
                                    status: 'approved',
                                    approvedAt: ISTUtils.getFullISTDateTime()
                                }
                                : entry
                        )
                    );
                }
                
                alert('Entry approved successfully!');
            };

            // New rejectEntry function
            const rejectEntry = (outlet, entryId) => {
                if (!confirm('Are you sure you want to reject this entry? This will permanently delete it.')) {
                    return;
                }
                
                addDebugMessage(`Rejecting entry ${entryId} for ${outlet}`, 'info');
                
                setIsLocalChange(true);
                setOutletData(prev => {
                    const newData = { ...prev };
                    newData[outlet] = newData[outlet].filter(entry => entry.id !== entryId);
                    return newData;
                });
                
                if (currentOutlet === outlet) {
                    setDailyEntries(prev => prev.filter(entry => entry.id !== entryId));
                }
                
                // Delete associated bills
                const entryToDelete = [...outletData[outlet], ...dailyEntries].find(entry => entry.id === entryId);
                if (entryToDelete && entryToDelete.materials) {
                    entryToDelete.materials.forEach(material => {
                        if (material.bills && material.bills.length > 0) {
                            FileUploadService.deleteMultipleBills(material.bills);
                        }
                    });
                }
                
                alert('Entry rejected and deleted successfully!');
            };

            // NEW FUNCTION: Delete entry for data_entry users
            const deleteEntry = (outlet, entryId) => {
                if (!confirm('Are you sure you want to delete this entry? This action cannot be undone.')) {
                    return;
                }
                
                addDebugMessage(`Deleting entry ${entryId} for ${outlet}`, 'info');
                
                // Find the entry to delete its bills
                const entryToDelete = [...outletData[outlet], ...dailyEntries].find(entry => entry.id === entryId);
                if (entryToDelete && entryToDelete.materials) {
                    entryToDelete.materials.forEach(material => {
                        if (material.bills && material.bills.length > 0) {
                            FileUploadService.deleteMultipleBills(material.bills);
                        }
                    });
                }
                
                setIsLocalChange(true);
                setOutletData(prev => {
                    const newData = { ...prev };
                    newData[outlet] = newData[outlet].filter(entry => entry.id !== entryId);
                    return newData;
                });
                
                if (currentOutlet === outlet) {
                    setDailyEntries(prev => prev.filter(entry => entry.id !== entryId));
                }
                
                alert('Entry deleted successfully!');
            };

            const getOutletName = (outlet) => {
                return outlet === 'orange_grand' ? 'Orange Grand' : 'Orange Restaurant';
            };

            const todayTotal = dailyItems.reduce((sum, item) => {
                const price = parseFloat(item.price) || 0;
                return sum + price;
            }, 0);

            const todayEntries = dailyEntries.filter(entry => 
                entry.date === ISTUtils.getISTDate() && entry.outlet === currentOutlet
            );

            const handleLogout = () => {
                addDebugMessage('User logging out', 'info');
                if (realtimeUnsubscribe) {
                    realtimeUnsubscribe();
                }
                localStorage.removeItem('currentUser');
                setCurrentUser(null);
            };

            const getSyncStatusMessage = () => {
                switch (syncStatus) {
                    case 'syncing':
                        return { message: 'Syncing with server...', class: 'warning' };
                    case 'success':
                        return { 
                            message: `Synced ${lastSync ? new Date(lastSync).toLocaleTimeString('en-IN', { timeZone: 'Asia/Kolkata' }) : ''}${isRealTimeActive ? ' (Live)' : ''}`, 
                            class: 'success' 
                        };
                    case 'error':
                        return { message: 'Sync failed. Using local data.', class: 'danger' };
                    default:
                        return { message: '', class: '' };
                }
            };

            const syncStatusInfo = getSyncStatusMessage();

            if (!currentUser) {
                return <LoginPage onLogin={setCurrentUser} />;
            }

            return (
                <div className="container-fluid">
                    <div className="header text-center">
                        <div className="user-badge">
                            <span className="badge bg-light text-dark">
                                <i className="bi bi-person-circle"></i> {currentUser.name}
                                <span className="role-indicator ms-2">{currentUser.role}</span>
                            </span>
                            <button className="btn btn-sm btn-outline-light ms-2" onClick={handleLogout}>
                                <i className="bi bi-box-arrow-right"></i> Logout
                            </button>
                        </div>
                        <h1><i className="bi bi-shop"></i> {getOutletName(currentOutlet)}</h1>
                        <p className="lead">Expense Tracker</p>
                        
                        <div className="outlet-switcher">
                            <div className="d-flex justify-content-center gap-3">
                                <button 
                                    className={`btn ${currentOutlet === 'orange_grand' ? 'btn-warning' : 'btn-outline-warning'}`}
                                    onClick={() => switchOutlet('orange_grand')}
                                >
                                    Orange Grand
                                </button>
                                <button 
                                    className={`btn ${currentOutlet === 'orange_restaurant' ? 'btn-warning' : 'btn-outline-warning'}`}
                                    onClick={() => switchOutlet('orange_restaurant')}
                                >
                                    Orange Restaurant
                                </button>
                            </div>
                        </div>
                    </div>
                    
                    
                    <div className="row">
                        <div className="col-md-3">
                            <div className="card">
                                <div className="card-header">
                                    <h5 className="mb-0">Navigation</h5>
                                </div>
                                <div className="card-body">
                                    <div className="list-group">
                                        {/* Show Daily Entry only for data_entry and approver roles */}
                                        {(currentUser.role === 'data_entry' || currentUser.role === 'approver') && (
                                            <button 
                                                className={`list-group-item list-group-item-action ${activeTab === 'daily' ? 'active' : ''}`}
                                                onClick={() => setActiveTab('daily')}
                                            >
                                                <i className="bi bi-journal-plus"></i> Daily Entry
                                            </button>
                                        )}
                                        {/* Show Past Entry only for data_entry and approver roles */}
                                        {(currentUser.role === 'data_entry' || currentUser.role === 'approver') && (
                                            <button 
                                                className={`list-group-item list-group-item-action ${activeTab === 'pastEntry' ? 'active' : ''}`}
                                                onClick={() => setActiveTab('pastEntry')}
                                            >
                                                <i className="bi bi-calendar-check"></i> Past Entry
                                            </button>
                                        )}
                                        {/* Show Reports for ALL roles including viewer */}
                                        <button 
                                            className={`list-group-item list-group-item-action ${activeTab === 'reports' ? 'active' : ''}`}
                                            onClick={() => setActiveTab('reports')}
                                            >
                                            <i className="bi bi-graph-up"></i> Reports
                                        </button>
                                        {/* Show Analysis for ALL roles including viewer */}
                                        <button 
                                            className={`list-group-item list-group-item-action ${activeTab === 'analysis' ? 'active' : ''}`}
                                            onClick={() => setActiveTab('analysis')}
                                        >
                                            <i className="bi bi-pie-chart"></i> Analysis
                                        </button>
                                        {/* Show Approvals only for approver role */}
                                        {currentUser.role === 'approver' && (
                                            <button 
                                                className={`list-group-item list-group-item-action ${activeTab === 'approvals' ? 'active' : ''}`}
                                                onClick={() => setActiveTab('approvals')}
                                            >
                                                <i className="bi bi-check-circle"></i> Approval Requests
                                            </button>
                                        )}
                                        {/* UPDATED: Show Sales & Expenses Report only for approver role - Now outlet specific */}
                                        {currentUser.role === 'approver' && (
                                            <button 
                                                className={`list-group-item list-group-item-action ${activeTab === 'salesExpensesReport' ? 'active' : ''}`}
                                                onClick={() => setActiveTab('salesExpensesReport')}
                                            >
                                                <i className="bi bi-calculator"></i> {getOutletName(currentOutlet)} Sales & Expenses Report
                                            </button>
                                        )}
                                    </div>
                                </div>
                            </div>
                            
                            <div className="card mt-4">
                                <div className="card-header">
                                    <h5 className="mb-0">Today's Summary - {getOutletName(currentOutlet)}</h5>
                                </div>
                                <div className="card-body">
                                    <div className="text-center">
                                        <h6>Today's Entries</h6>
                                        <h4>{todayEntries.length}</h4>
                                    </div>
                                    <div className="text-center mt-3">
                                        <h6>Today's Total</h6>
                                        <h4>
                                            <span className="rupee-icon">₹</span>
                                            {todayEntries.reduce((sum, entry) => sum + entry.total, 0).toFixed(2)}
                                        </h4>
                                    </div>
                                    {/* Show Current Entry only for data_entry and approver roles */}
                                    {(currentUser.role === 'data_entry' || currentUser.role === 'approver') && (
                                        <div className="text-center mt-3">
                                            <h6>Current Entry</h6>
                                            <h4>
                                                <span className="rupee-icon">₹</span>
                                                {todayTotal.toFixed(2)}
                                            </h4>
                                        </div>
                                    )}
                                    <div className="text-center mt-3">
                                        <small className="text-muted">
                                            IST: {ISTUtils.getCurrentISTDisplay()}<br />
                                            Time: {ISTUtils.getISTTime12Hour()}
                                        </small>
                                    </div>
                                </div>
                            </div>

                            {/* Show Pending Approvals only for approver role */}
                            {currentUser.role === 'approver' && (
                                <div className="card mt-4">
                                    <div className="card-header">
                                        <h5 className="mb-0">Pending Approvals</h5>
                                    </div>
                                    <div className="card-body">
                                        <div className="text-center">
                                            <h6>Orange Grand</h6>
                                            <h4 className="text-warning">
                                                {outletData.orange_grand.filter(entry => entry.status === 'pending').length}
                                            </h4>
                                        </div>
                                        <div className="text-center mt-3">
                                            <h6>Orange Restaurant</h6>
                                            <h4 className="text-warning">
                                                {outletData.orange_restaurant.filter(entry => entry.status === 'pending').length}
                                            </h4>
                                        </div>
                                    </div>
                                </div>
                            )}
                        </div>
                        
                        <div className="col-md-9">
                            {/* Daily Entry Tab - Only for data_entry and approver */}
                            {activeTab === 'daily' && (currentUser.role === 'data_entry' || currentUser.role === 'approver') && (
                                <div className="card">
                                    <div className="card-header">
                                        <h5 className="mb-0">Daily Expense Entry - {getOutletName(currentOutlet)}</h5>
                                    </div>
                                    <div className="card-body">
                                        <div className="alert alert-info">
                                            <i className="bi bi-info-circle"></i> Enter prices and quantities for today's expenses
                                            {firebaseStatus !== 'connected' && (
                                                <div className="mt-2 alert alert-warning">
                                                    <i className="bi bi-exclamation-triangle"></i> Offline mode - data will be stored locally only
                                                </div>
                                            )}
                                        </div>
                                        
                                        <div className="row mb-4">
                                            <div className="col-md-12">
                                                <h6>Date: {ISTUtils.getCurrentISTDisplay()}</h6>
                                                <p className="text-muted">Submitted by: {currentUser.name} | Time: {ISTUtils.getFullISTDateTime()}</p>
                                            </div>
                                        </div>

                                        <h6>Regular Items</h6>
                                        <ItemList 
                                            dailyItems={dailyItems}
                                            updateItemField={updateItemField}
                                            onBillsUpload={handleBillsUpload}
                                            currentOutlet={currentOutlet}
                                        />

                                        <h6>Unexpected Items</h6>
                                        <UnexpectedItemsList 
                                            dailyItems={dailyItems}
                                            updateItemField={updateItemField}
                                            addUnexpectedItem={addUnexpectedItem}
                                            removeUnexpectedItem={removeUnexpectedItem}
                                            newUnexpectedItem={newUnexpectedItem}
                                            setNewUnexpectedItem={setNewUnexpectedItem}
                                            onBillsUpload={handleBillsUpload}
                                            currentOutlet={currentOutlet}
                                        />
                                        
                                        <div className="d-flex justify-content-between align-items-center mb-4 p-3 bg-light rounded">
                                            <h5 className="mb-0">Current Total: <span className="text-success">₹{todayTotal.toFixed(2)}</span></h5>
                                            <button className="btn btn-primary btn-lg" onClick={addDailyEntry}>
                                                <i className="bi bi-save"></i> Save Daily Entry
                                            </button>
                                        </div>

                                        {todayEntries.length > 0 && (
                                            <div className="mt-4">
                                                <h6>Today's Saved Entries - {getOutletName(currentOutlet)}</h6>
                                                <div className="table-responsive">
                                                    <table className="table table-sm table-hover">
                                                        <thead>
                                                            <tr>
                                                                <th>Time (IST)</th>
                                                                <th>Submitted By</th>
                                                                <th>Status</th>
                                                                <th>Items</th>
                                                                <th>Total</th>
                                                                <th>Bills</th>
                                                                <th>Actions</th>
                                                            </tr>
                                                        </thead>
                                                        <tbody>
                                                            {todayEntries.map((entry, index) => {
                                                                const totalBills = entry.materials?.reduce((sum, material) => 
                                                                    sum + (material.bills?.length || 0), 0) || 0;
                                                                return (
                                                                    <tr key={entry.id || index} className={entry.status === 'approved' ? 'approved-row' : 'pending-row'}>
                                                                        <td>{entry.timestamp}</td>
                                                                        <td>{entry.submittedBy}</td>
                                                                        <td>
                                                                            <span className={`badge ${entry.status === 'approved' ? 'status-badge-approved' : 'status-badge-pending'}`}>
                                                                                {entry.status === 'approved' ? 
                                                                                    `Approved by ${entry.approvedBy}` : 
                                                                                    'Pending Approval'}
                                                                            </span>
                                                                        </td>
                                                                        <td>{entry.materials.length} items</td>
                                                                        <td>
                                                                            <strong>₹{entry.total.toFixed(2)}</strong>
                                                                        </td>
                                                                        <td>
                                                                            <span className={`badge ${totalBills > 0 ? 'bg-success' : 'bg-secondary'}`}>
                                                                                {totalBills} bills
                                                                            </span>
                                                                        </td>
                                                                        <td>
                                                                            <div className="btn-group btn-group-sm">
                                                                                {currentUser.role === 'approver' && entry.status !== 'approved' && (
                                                                                    <>
                                                                                        <button 
                                                                                            className="btn btn-success btn-sm"
                                                                                            onClick={() => approveEntry(currentOutlet, entry.id)}
                                                                                        >
                                                                                            <i className="bi bi-check-lg"></i> Approve
                                                                                        </button>
                                                                                        <button 
                                                                                            className="btn btn-danger btn-sm"
                                                                                            onClick={() => rejectEntry(currentOutlet, entry.id)}
                                                                                        >
                                                                                            <i className="bi bi-x-lg"></i> Reject
                                                                                        </button>
                                                                                    </>
                                                                                )}
                                                                                {/* Delete button for data_entry users for their own pending entries */}
                                                                                {currentUser.role === 'data_entry' && 
                                                                                 entry.status === 'pending' && 
                                                                                 entry.submittedBy === currentUser.name && (
                                                                                    <button 
                                                                                        className="btn btn-outline-danger btn-sm"
                                                                                        onClick={() => deleteEntry(currentOutlet, entry.id)}
                                                                                        title="Delete Entry"
                                                                                    >
                                                                                        <i className="bi bi-trash"></i> Delete
                                                                                    </button>
                                                                                )}
                                                                            </div>
                                                                        </td>
                                                                    </tr>
                                                                );
                                                            })}
                                                        </tbody>
                                                    </table>
                                                </div>
                                            </div>
                                        )}
                                    </div>
                                </div>
                            )}
                            
                            {/* Past Entry Tab - Only for data_entry and approver */}
                            {activeTab === 'pastEntry' && (currentUser.role === 'data_entry' || currentUser.role === 'approver') && (
                                <PastEntryTab

                    {showPreview && previewEntry && (
