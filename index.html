                                        <h6>Items:</h6>

                                                <tbody>
                                                    {previewEntry.materials.map((item, idx) => (

                                                            <td>{item.name}</td>

                                                            <td>₹{item.price}</td>

                                                            <td>
                                                                {item.bills && item.bills.length > 0 ? (

                                                                                key={billIdx}

                                                                                {billIdx + 1}

                                                                        {item.bills.length > 3 && (

                                                                                +{item.bills.length - 3}

                                                </tbody>
                                            </table>

                                        <div className="d-flex justify-content-end mt-3 p-3 bg-light rounded">
                                            <h5 className="mb-0">
                                                Total Amount: <span className="text-success">₹{previewEntry.total.toFixed(2)}</span>
                                            </h5>
                                        </div>

                                    <div className="modal-footer">
                                        <button type="button" className="btn btn-secondary" onClick={closePreview}>
                                            Close
                                        </button>
                                        {previewEntry.status === 'pending' ? (
                                            <>
                                                <button 
                                                    type="button" 
                                                    className="btn btn-success"

                                                        closePreview();

                                                >
                                                    <i className="bi bi-check-lg"></i> Approve
                                                </button>
                                                <button 
                                                    type="button" 
                                                    className="btn btn-danger"

                                                >
                                                    <i className="bi bi-x-lg"></i> Reject
                                                </button>
                                            </>
                                        ) : (

                                                type="button" 
                                                className="btn btn-danger"
                                                onClick={() => {
                                                    handleDeleteApproved(previewEntry.outlet, previewEntry);
                                                    closePreview();

                                                <i className="bi bi-trash"></i> Delete
                                            </button>

                            </div>

                    )}
                </div>
            );
        };

        const ReportsTab = ({ 
            dailyEntries, 
            currentOutlet, 
            getOutletName, 
            currentUser, 
            isRealTimeActive, 
            firebaseStatus,
            onDeleteEntry 
        }) => {
            const [reportType, setReportType] = useState('today');
            const [customStartDate, setCustomStartDate] = useState('');
            const [customEndDate, setCustomEndDate] = useState('');
            const [itemSearch, setItemSearch] = useState('');
            const [searchResults, setSearchResults] = useState([]);
            const [showPdfPreview, setShowPdfPreview] = useState(false);
            const [pdfContent, setPdfContent] = useState('');
            const [selectedBill, setSelectedBill] = useState(null);
            const [showBillModal, setShowBillModal] = useState(false);
            
            // New state for sorting
            const [sortBy, setSortBy] = useState('date'); // 'date', 'item', 'submittedBy', 'approvedBy'
            const [sortOrder, setSortOrder] = useState('desc'); // 'asc' or 'desc'

            useEffect(() => {
                if (reportType === 'custom') {
                    const today = ISTUtils.getISTDate();
                    const oneWeekAgo = new Date(new Date().getTime() - 7 * 24 * 60 * 60 * 1000);
                    const oneWeekAgoIST = new Date(oneWeekAgo.getTime() + (5.5 * 60 * 60 * 1000)).toISOString().split('T')[0];
                    
                    if (!customStartDate) {
                        setCustomStartDate(oneWeekAgoIST);
                    }
                    if (!customEndDate) {
                        setCustomEndDate(today);
                    }
                }
            }, [reportType, customStartDate, customEndDate]);

            const getFilteredEntries = () => {
                const todayIST = ISTUtils.getISTDate();
                
                switch (reportType) {
                    case 'today':
                        return dailyEntries.filter(entry => entry.date === todayIST && entry.outlet === currentOutlet);
                    case 'week':
                        const oneWeekAgo = new Date(new Date().getTime() - 7 * 24 * 60 * 60 * 1000);
                        const oneWeekAgoIST = new Date(oneWeekAgo.getTime() + (5.5 * 60 * 60 * 1000)).toISOString().split('T')[0];
                        return dailyEntries.filter(entry => {
                            return entry.date >= oneWeekAgoIST && entry.date <= todayIST && entry.outlet === currentOutlet;
                        });
                    case 'month':
                        const now = new Date();
                        const firstDayOfMonth = new Date(now.getFullYear(), now.getMonth(), 1);
                        const firstDayOfMonthIST = new Date(firstDayOfMonth.getTime() + (5.5 * 60 * 60 * 1000)).toISOString().split('T')[0];
                        return dailyEntries.filter(entry => {
                            return entry.date >= firstDayOfMonthIST && entry.date <= todayIST && entry.outlet === currentOutlet;
                        });
                    case 'custom':
                        if (!customStartDate || !customEndDate) {
                            return [];
                        }
                        return dailyEntries.filter(entry => {
                            return entry.date >= customStartDate && entry.date <= customEndDate && entry.outlet === currentOutlet;
                        });
                    default:
                        return dailyEntries.filter(entry => entry.outlet === currentOutlet);
                }
            };

            // Function to sort entries
            const getSortedEntries = (entries) => {
                if (!entries || entries.length === 0) return entries;
                
                return [...entries].sort((a, b) => {
                    let aValue, bValue;
                    
                    switch (sortBy) {
                        case 'date':
                            aValue = a.date;
                            bValue = b.date;
                            break;
                        case 'item':
                            // For entries, we'll sort by the first item name
                            aValue = a.materials.length > 0 ? a.materials[0].name : '';
                            bValue = b.materials.length > 0 ? b.materials[0].name : '';
                            break;
                        case 'submittedBy':
                            aValue = a.submittedBy || '';
                            bValue = b.submittedBy || '';
                            break;
                        case 'approvedBy':
                            aValue = a.approvedBy || '';
                            bValue = b.approvedBy || '';
                            break;
                        default:
                            aValue = a.date;
                            bValue = b.date;
                    }
                    
                    // Handle empty values
                    if (!aValue && bValue) return sortOrder === 'asc' ? -1 : 1;
                    if (aValue && !bValue) return sortOrder === 'asc' ? 1 : -1;
                    if (!aValue && !bValue) return 0;
                    
                    // Compare values
                    if (aValue < bValue) return sortOrder === 'asc' ? -1 : 1;
                    if (aValue > bValue) return sortOrder === 'asc' ? 1 : -1;
                    return 0;
                });
            };

            // Function to sort items for item-wise breakdown
            const getSortedItems = (items) => {
                if (!items || items.length === 0) return items;
                
                return [...items].sort((a, b) => {
                    let aValue, bValue;
                    
                    switch (sortBy) {
                        case 'date':
                            aValue = a.date;
                            bValue = b.date;
                            break;
                        case 'item':
                            aValue = a.name || '';
                            bValue = b.name || '';
                            break;
                        case 'submittedBy':
                            aValue = a.submittedBy || '';
                            bValue = b.submittedBy || '';
                            break;
                        case 'approvedBy':
                            aValue = a.approvedBy || '';
                            bValue = b.approvedBy || '';
                            break;
                        default:
                            aValue = a.date;
                            bValue = b.date;
                    }
                    
                    // Handle empty values
                    if (!aValue && bValue) return sortOrder === 'asc' ? -1 : 1;
                    if (aValue && !bValue) return sortOrder === 'asc' ? 1 : -1;
                    if (!aValue && !bValue) return 0;
                    
                    // Compare values
                    if (aValue < bValue) return sortOrder === 'asc' ? -1 : 1;
                    if (aValue > bValue) return sortOrder === 'asc' ? 1 : -1;
                    return 0;
                });
            };

            const searchItem = () => {
                if (!itemSearch.trim()) {
                    setSearchResults([]);
                    return;
                }

                const results = [];
                dailyEntries.forEach(entry => {
                    entry.materials.forEach(material => {
                        if (material.name.toLowerCase().includes(itemSearch.toLowerCase()) && entry.outlet === currentOutlet) {
                            results.push({
                                date: entry.date,
                                name: material.name,
                                quantity: material.quantity,
                                price: material.price,
                                total: material.itemTotal,
                                bills: material.bills || [],
                                submittedBy: entry.submittedBy,
                                approvedBy: entry.approvedBy,
                                outlet: entry.outlet,
                                entryId: entry.id
                            });
                        }
                    });
                });

                setSearchResults(results);
            };

            const handleViewBill = (billUrl) => {
                setSelectedBill(billUrl);
                setShowBillModal(true);
            };

            const closeBillModal = () => {
                setShowBillModal(false);
                setSelectedBill(null);
            };

        const generatePdfContent = () => {
            const filteredEntries = getFilteredEntries();
            const sortedEntries = getSortedEntries(filteredEntries);
            
            const totalAmount = sortedEntries.reduce((sum, entry) => sum + entry.total, 0);
            const totalItems = sortedEntries.reduce((sum, entry) => sum + entry.materials.length, 0);
            
            // Create all items array for item-wise breakdown
            const allItems = [];
            sortedEntries.forEach(entry => {
                entry.materials.forEach(material => {
                    allItems.push({
                        date: entry.date,
                        name: material.name,
                        quantity: material.quantity,
                        price: material.price,
                        total: material.itemTotal,
                        bills: material.bills || [],
                        submittedBy: entry.submittedBy,
                        approvedBy: entry.approvedBy
                    });
                });
            });

            // Sort items for item-wise breakdown
            const sortedItems = getSortedItems(allItems);

            // Count items with bills
            const itemsWithBills = allItems.filter(item => item.bills && item.bills.length > 0).length;
            const totalBills = allItems.reduce((sum, item) => sum + (item.bills?.length || 0), 0);

            return `
                <div class="report-pdf-content">
                    <div class="report-header">
                        <div class="report-title">${getOutletName(currentOutlet)}</div>
                        <div class="report-subtitle">${getReportPeriodText()} Expense Report</div>
                        ${reportType === 'custom' ? `<div>Period: ${ISTUtils.formatISTDate(customStartDate)} to ${ISTUtils.formatISTDate(customEndDate)}</div>` : ''}
                        <div>Generated on: ${ISTUtils.getCurrentISTDisplay()}</div>
                        <div>Generated at: ${ISTUtils.getFullISTDateTime()}</div>
                        <div>Generated by: ${currentUser.name}</div>
                        <div>Data Source: ${firebaseStatus === 'connected' ? 'Firebase (Live)' : 'Local Storage'}</div>
                        <div>Sorted by: ${getSortByLabel()} (${sortOrder === 'asc' ? 'Ascending' : 'Descending'})</div>
                    </div>
                    
                    <div class="report-summary">
                        <div class="summary-item">
                            <div class="summary-value">₹${totalAmount.toFixed(2)}</div>
                            <div class="summary-label">Total Amount</div>
                        </div>
                        <div class="summary-item">
                            <div class="summary-value">${sortedEntries.length}</div>
                            <div class="summary-label">Number of Entries</div>
                        </div>
                        <div class="summary-item">
                            <div class="summary-value">${totalItems}</div>
                            <div class="summary-label">Total Items</div>
                        </div>
                        <div class="summary-item">
                            <div class="summary-value">${totalBills}</div>
                            <div class="summary-label">Total Bills</div>
                        </div>
                    </div>

                    <h3>Expense Details (Sorted by ${getSortByLabel()})</h3>
                    <table class="report-table">
                        <thead>
                            <tr>
                                <th>Date</th>
                                <th>Submitted By</th>
                                <th>Approved By</th>
                                <th>Item Name</th>
                                <th>Quantity</th>
                                <th>Total Amount</th>
                                <th>Bills Count</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${sortedEntries.map(entry => {
                                // Create rows for each item in the entry
                                return entry.materials.map((material, index) => `
                                    <tr>
                                        <td>${index === 0 ? ISTUtils.formatISTDate(entry.date) : ''}</td>
                                        <td>${index === 0 ? entry.submittedBy : ''}</td>
                                        <td>${index === 0 ? (entry.approvedBy || 'Pending') : ''}</td>
                                        <td>${material.name}</td>
                                        <td>${material.quantity}</td>
                                        <td class="total-amount">₹${material.itemTotal?.toFixed(2) || parseFloat(material.price || 0).toFixed(2)}</td>
                                        <td>${material.bills?.length || 0}</td>
                                    </tr>
                                `).join('');
                            }).join('')}
                        </tbody>
                    </table>

                    ${totalBills > 0 ? `
                        <div style="margin-top: 15px; padding: 10px; background: #f8f9fa; border-radius: 5px;">
                            <h4>Bill Information</h4>
                            <p style="font-size: 8px; margin: 5px 0;">
                                Total bills uploaded: <strong>${totalBills}</strong><br>
                                Items with bills: <strong>${itemsWithBills}</strong> out of <strong>${allItems.length}</strong> total items
                            </p>
                        </div>
                    ` : ''}

                    <div style="margin-top: 20px; padding-top: 10px; border-top: 1px solid #ddd;">
                        <p style="font-size: 8px; color: #666; text-align: center;">
                            Report generated by Orange Expense Tracker • ${ISTUtils.getCurrentISTDisplay()} • ${ISTUtils.getFullISTDateTime()}
                        </p>
                        <p style="font-size: 8px; color: #666; text-align: center;">
                            Sorted by: ${getSortByLabel()} (${sortOrder === 'asc' ? 'Ascending' : 'Descending'})
                        </p>
                    </div>
                </div>
            `;
        };

            const getSortByLabel = () => {
                switch (sortBy) {
                    case 'date': return 'Date';
                    case 'item': return 'Item Name';
                    case 'submittedBy': return 'Submitted By';
                    case 'approvedBy': return 'Approved By';
                    default: return 'Date';
                }
            };

            const previewReport = () => {
                if (reportType === 'custom' && (!customStartDate || !customEndDate)) {
                    alert("Please select both start and end dates for custom period");
                    return;
                }
                
                const content = generatePdfContent();
                setPdfContent(content);
                setShowPdfPreview(true);
            };

            const downloadReport = () => {
                if (reportType === 'custom' && (!customStartDate || !customEndDate)) {
                    alert("Please select both start and end dates for custom period");
                    return;
                }
                
                const content = generatePdfContent();
                
                const element = document.createElement('div');
                element.innerHTML = content;
                
                const opt = {
                    margin: 5,
                    filename: `${getOutletName(currentOutlet).replace(' ', '_')}_${getReportPeriodText().toLowerCase()}_report_${ISTUtils.getISTDate()}_sorted_by_${sortBy}.pdf`,
                    image: { type: 'jpeg', quality: 0.98 },
                    html2canvas: { 
                        scale: 2,
                        useCORS: true,
                        scrollY: 0
                    },
                    jsPDF: { 
                        unit: 'mm', 
                        format: 'a4', 
                        orientation: 'portrait' 
                    }
                };

                html2pdf().set(opt).from(element).save();
            };

            const getReportPeriodText = () => {
                switch (reportType) {
                    case 'today': return 'Today';
                    case 'week': return 'Weekly';
                    case 'month': return 'Monthly';
                    case 'custom': return 'Custom';
                    default: return 'Report';
                }
            };

            const filteredEntries = getFilteredEntries();
            const sortedEntries = getSortedEntries(filteredEntries);
            
            return (
                <>
                    <div className="card">
                        <div className="card-header d-flex justify-content-between align-items-center">
                            <h5 className="mb-0">Expense Reports - {getOutletName(currentOutlet)}</h5>
                            <div>
                                {firebaseStatus === 'connected' ? (
                                    <span className="badge bg-success real-time-badge">
                                        <i className="bi bi-circle-fill"></i> {isRealTimeActive ? 'Live Data' : 'Firebase Connected'}
                                    </span>
                                ) : (
                                    <span className="badge bg-warning">
                                        <i className="bi bi-exclamation-triangle"></i> Local Data Only
                                    </span>
                                )}
                            </div>
                        </div>
                        <div className="card-body">
                            <div className="alert alert-info">
                                <i className="bi bi-info-circle"></i> 
                                {firebaseStatus === 'connected' 
                                    ? 'Data is synced with Firebase cloud database'
                                    : 'Working in offline mode - data stored locally only'}
                                <br />
                            </div>
                            
                            <div className="download-options">
                                <div className="row mb-3">
                                    <div className="col-md-6">
                                        <label className="form-label">Report Period</label>
                                        <select 
                                            className="form-select"
                                            value={reportType}
                                            onChange={(e) => setReportType(e.target.value)}
                                        >
                                            <option value="today">Today</option>
                                            <option value="week">This Week</option>
                                            <option value="month">This Month</option>
                                            <option value="custom">Custom Period</option>
                                        </select>
                                    </div>
                                    <div className="col-md-6">
                                        <label className="form-label">PDF Options</label>
                                        <div className="d-grid gap-2 d-md-flex">
                                            <button className="btn btn-info me-md-2 w-100" onClick={previewReport}>
                                                <i className="bi bi-eye"></i> Preview PDF
                                            </button>
                                            <button className="btn btn-success w-100" onClick={downloadReport}>
                                                <i className="bi bi-download"></i> Download PDF
                                            </button>
                                        </div>
                                    </div>
                                </div>

                                {/* Sorting Controls */}
                                <div className="sorting-controls">
                                    <h6><i className="bi bi-sort-down"></i> PDF Sorting Options</h6>
                                    <div className="row">
                                        <div className="col-md-6">
                                            <div className="sort-option">
                                                <label className="form-label small">Sort By:</label>
                                                <select 
                                                    className="form-select form-select-sm"
                                                    value={sortBy}
                                                    onChange={(e) => setSortBy(e.target.value)}
                                                >
                                                    <option value="date">Date</option>
                                                    <option value="item">Item Name</option>
                                                    <option value="submittedBy">Submitted By</option>
                                                    <option value="approvedBy">Approved By</option>
                                                </select>
                                            </div>
                                        </div>
                                        <div className="col-md-6">
                                            <div className="sort-option">
                                                <label className="form-label small">Order:</label>
                                                <div className="btn-group w-100" role="group">
                                                    <button 
                                                        type="button" 
                                                        className={`btn btn-sm ${sortOrder === 'asc' ? 'btn-primary' : 'btn-outline-primary'}`}
                                                        onClick={() => setSortOrder('asc')}
                                                    >
                                                        <i className="bi bi-sort-alpha-down"></i> Ascending
                                                    </button>
                                                    <button 
                                                        type="button" 
                                                        className={`btn btn-sm ${sortOrder === 'desc' ? 'btn-primary' : 'btn-outline-primary'}`}
                                                        onClick={() => setSortOrder('desc')}
                                                    >
                                                        <i className="bi bi-sort-alpha-down-alt"></i> Descending
                                                    </button>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                    <div className="mt-2">
                                        <small className="text-muted">
                                            <i className="bi bi-info-circle"></i> Sorting will be applied to both the entries table and item-wise breakdown in the PDF.
                                        </small>
                                    </div>
                                </div>

                                {reportType === 'custom' && (
                                    <div className="custom-period-selector">
                                        <div className="row">
                                            <div className="col-md-6">
                                                <label className="form-label">Start Date</label>
                                                <input 
                                                    type="date" 
                                                    className="form-control"
                                                    value={customStartDate}
                                                    onChange={(e) => setCustomStartDate(e.target.value)}
                                                    max={ISTUtils.getISTDate()}
                                                />
                                            </div>
                                            <div className="col-md-6">
                                                <label className="form-label">End Date</label>
                                                <input 
                                                    type="date" 
                                                    className="form-control"
                                                    value={customEndDate}
                                                    onChange={(e) => setCustomEndDate(e.target.value)}
                                                    max={ISTUtils.getISTDate()}
                                                    min={customStartDate}
                                                />
                                            </div>
                                        </div>
                                    </div>
                                )}
                                
                                <div className="row mt-3">
                                    <div className="col-12">
                                        <div className="input-group">
                                            <input 
                                                type="text" 
                                                className="form-control" 
                                                placeholder="Search item..."
                                                value={itemSearch}
                                                onChange={(e) => setItemSearch(e.target.value)}
                                            />
                                            <button className="btn btn-primary" onClick={searchItem}>
                                                <i className="bi bi-search"></i> Search
                                            </button>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <div className="table-responsive">
                                <table className="table table-striped">
                                    <thead>
                                        <tr>
                                            <th>Date</th>
                                            <th>Time (IST)</th>
                                            <th>Submitted By</th>
                                            <th>Approved By</th>
                                            <th>Items</th>
                                            <th>Total Amount</th>
                                            <th>Bills</th>
                                            <th>Actions</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        {sortedEntries.length > 0 ? (
                                            sortedEntries.map((entry, index) => {
                                                const totalBills = entry.materials.reduce((sum, material) => 
                                                    sum + (material.bills?.length || 0), 0);
                                                return (
                                                    <tr key={entry.id || index} className={entry.status === 'approved' ? 'approved-row' : 'pending-row'}>
                                                        <td>{ISTUtils.formatISTDate(entry.date)}</td>
                                                        <td>{entry.timestamp}</td>
                                                        <td>{entry.submittedBy}</td>
                                                        <td>{entry.approvedBy || 'Pending'}</td>
                                                        <td>{entry.materials.length} items</td>
                                                        <td><strong>₹{entry.total.toFixed(2)}</strong></td>
                                                        <td>
                                                            <span className={`badge ${totalBills > 0 ? 'bg-success' : 'bg-secondary'}`}>
                                                                {totalBills} bills
                                                            </span>
                                                        </td>
                                                        <td>
                                                            {/* Delete button for data_entry users for their own pending entries */}
                                                            {currentUser.role === 'data_entry' && 
                                                             entry.status === 'pending' && 
                                                             entry.submittedBy === currentUser.name && (
                                                                <button 
                                                                    className="btn btn-sm btn-outline-danger"
                                                                    onClick={() => onDeleteEntry(currentOutlet, entry.id)}
                                                                    title="Delete Entry"
                                                                >
                                                                    <i className="bi bi-trash"></i>
                                                                </button>
                                                            )}
                                                        </td>
                                                    </tr>
                                                );
                                            })
                                        ) : (
                                            <tr>
                                                <td colSpan="8" className="text-center py-4">
                                                    No expenses found for the selected period. 
                                                    {reportType === 'custom' && ' Please check your custom date range.'}
                                                    {firebaseStatus !== 'connected' && ' Firebase connection may be required.'}
                                                </td>
                                            </tr>
                                        )}
                                    </tbody>
                                </table>
                            </div>

                            {searchResults.length > 0 && (
                                <div className="mt-4">
                                    <h5>Search Results for "{itemSearch}"</h5>
                                    <div className="table-responsive">
                                        <table className="table table-sm table-hover">
                                            <thead>
                                                <tr>
                                                    <th>Date</th>
                                                    <th>Item Name</th>
                                                    <th>Quantity</th>
                                                    <th>Price</th>
                                                    <th>Total</th>
                                                    <th>Bills</th>
                                                    <th>Submitted By</th>
                                                    <th>Actions</th>
                                                </tr>
                                            </thead>
                                            <tbody>
                                                {searchResults.map((result, index) => (
                                                    <tr key={index}>
                                                        <td>{ISTUtils.formatISTDate(result.date)}</td>
                                                        <td>{result.name}</td>
                                                        <td>{result.quantity}</td>
                                                        <td>₹{result.price}</td>
                                                        <td><strong>₹{result.total.toFixed(2)}</strong></td>
                                                        <td>
                                                            {result.bills && result.bills.length > 0 ? (
                                                                <div className="btn-group btn-group-sm">
                                                                    {result.bills.slice(0, 3).map((bill, billIdx) => (
                                                                        <button 
                                                                            key={billIdx}
                                                                            className="btn btn-sm btn-outline-primary"
                                                                            onClick={() => handleViewBill(bill.url)}
                                                                            title={bill.name || `Bill ${billIdx + 1}`}
                                                                        >
                                                                            {billIdx + 1}
                                                                        </button>
                                                                    ))}
                                                                    {result.bills.length > 3 && (
                                                                        <span className="btn btn-sm btn-outline-secondary">
                                                                            +{result.bills.length - 3}
                                                                        </span>
                                                                    )}
                                                                </div>
                                                            ) : (
                                                                <span className="text-muted">No Bills</span>
                                                            )}
                                                        </td>
                                                        <td>{result.submittedBy}</td>
                                                        <td>
                                                            {/* Delete button for data_entry users for their own pending entries in search results */}
                                                            {currentUser.role === 'data_entry' && 
                                                             result.submittedBy === currentUser.name && (
                                                                <button 
                                                                    className="btn btn-sm btn-outline-danger"
                                                                    onClick={() => onDeleteEntry(currentOutlet, result.entryId)}
                                                                    title="Delete Entry"
                                                                >
                                                                    <i className="bi bi-trash"></i> Delete
                                                                </button>
                                                            )}
                                                        </td>
                                                    </tr>
                                                ))}
                                            </tbody>
                                        </table>
                                    </div>
                                </div>
                            )}
                        </div>
                    </div>

                    <BillModal 
                        show={showBillModal}
                        onClose={closeBillModal}
                        billUrl={selectedBill}
                    />

                    <PdfPreviewModal 
                        show={showPdfPreview}
                        onClose={() => setShowPdfPreview(false)}
                        pdfContent={pdfContent}
                        onDownload={downloadReport}
                    />
                </>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
